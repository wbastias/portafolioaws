<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo HTML</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="escena">

        <!-- CAPA 1: DÍA Y NOCHE -->
        <div class="capa capa-dia-noche">
            <img src="img/diaynoche.png" alt="Día y noche">
        </div>

        <!-- CAPA 2: TELÓN -->
        <div class="capa capa-telon">
            <img src="img/telon.png" alt="Telón">
        </div>

        <!-- CAPA 3: TEATRO -->
        <div class="capa capa-teatro">
            <img src="img/teatro.png" alt="Teatro">
        </div>
        <div id="contador-clicks">0 / 4</div>
        <!-- CAPA 4: ROBOT -->
        <div class="capa capa-robot">
            <img id="robot" src="img/inicio.png" alt="robot">
        </div>

        <!-- CAPA 5: info -->
        <div class="capa capa-info">
            <img id="info" src="img/informacion.png" alt="robot">
        </div>

        <!-- CAPA 6: viaje -->
        <div class="capa capa-viaje">
            <img id="viaje" src="img/viaje.png" alt="robot">
        </div>
        <!-- CAPA 7: viaje -->
        <div class="capa capa-cierre">
            <img id="btn-reset" src="img/cierre.png" alt="robot">
        </div>
        <!-- CAPA 8: viaje -->
        <div class="capa capa-solyluna">
            <img id="solyluna" src="img/solyluna1.png" alt="robot">
        </div>
        <!-- CAPA 8: viaje -->
        <div class="capa capa-walter">
            <img id="walter" src="img/almedio.png" alt="robot">
        </div>
        <!-- CAPA 8: viaje -->
        <div class="capa capa-click">
            <img id="click" src="img/click.png" alt="robot">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
